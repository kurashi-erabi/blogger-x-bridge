name: Impression Farming Posts

on:
  schedule:
    # 3時間おきに実行(ブログ誘導ツイートは4時間おきなので、無リンク投稿が自然と多めになる)
    - cron: '30 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-impression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies for canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm install

      - name: Post impression tweet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run post-impression

      - name: Commit updated history
        run: |
          git config user.name "impression-posts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/impression-history.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update impression post history"
          git push
